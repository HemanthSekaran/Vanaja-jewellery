<div class="container min-h-[600px] flex items-center justify-center py-10">
    <div class="w-full max-w-md space-y-8 bg-card p-8 rounded-lg border shadow-sm">
        <div class="text-center space-y-2">
            <h1 class="text-3xl font-serif font-bold tracking-tight">Welcome Back</h1>
            <p class="text-muted-foreground">Enter your email to sign in to your account</p>
        </div>

        <form (ngSubmit)="onSubmit()" class="space-y-6">
            <div class="space-y-2">
                <label for="email"
                    class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70">Email</label>
                <input type="email" id="email" [(ngModel)]="email" name="email" required
                    class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm ring-offset-background file:border-0 file:bg-transparent file:text-sm file:font-medium placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50"
                    placeholder="name@example.com">
            </div>

            <div class="space-y-2">
                <label for="password"
                    class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70">Password</label>
                <input type="password" id="password" [(ngModel)]="password" name="password" required
                    class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm ring-offset-background file:border-0 file:bg-transparent file:text-sm file:font-medium placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50">
            </div>

            <button type="submit"
                class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 bg-primary text-primary-foreground hover:bg-primary/90 h-10 px-4 py-2 w-full">
                Sign In
            </button>
        </form>

        <div class="text-center text-sm">
            <span class="text-muted-foreground">Don't have an account? </span>
            <a routerLink="/signup" class="font-medium underline underline-offset-4 hover:text-primary">
                Sign up
            </a>
        </div>
    </div>
</div>
