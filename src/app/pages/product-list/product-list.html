<div class="container mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="flex flex-col lg:flex-row gap-8">
        <!-- Mobile Filter Toggle -->
        <div class="lg:hidden mb-4 flex justify-between items-center">
            <h1 class="text-xl font-bold">Products</h1>
            <button (click)="isMobileFilterOpen = true"
                class="flex items-center gap-2 px-4 py-2 border rounded-sm bg-white hover:bg-gray-50 text-sm font-medium uppercase tracking-wide">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="4" y1="21" x2="4" y2="14"></line>
                    <line x1="4" y1="10" x2="4" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="12"></line>
                    <line x1="12" y1="8" x2="12" y2="3"></line>
                    <line x1="20" y1="21" x2="20" y2="16"></line>
                    <line x1="20" y1="12" x2="20" y2="3"></line>
                    <line x1="1" y1="14" x2="7" y2="14"></line>
                    <line x1="9" y1="8" x2="15" y2="8"></line>
                    <line x1="17" y1="16" x2="23" y2="16"></line>
                </svg>
                Filters
            </button>
        </div>

        <!-- Filters Drawer (Mobile) / Sidebar (Desktop) -->
        <div class="fixed inset-0 z-50 lg:hidden" *ngIf="isMobileFilterOpen">
            <!-- Backdrop -->
            <div class="absolute inset-0 bg-black/50 transition-opacity" (click)="isMobileFilterOpen = false"></div>
            <!-- Drawer Content -->
            <div
                class="absolute inset-y-0 left-0 w-[300px] bg-white shadow-xl overflow-y-auto animate-in slide-in-from-left">
                <div class="flex items-center justify-between p-4 border-b">
                    <h2 class="font-bold text-lg">Filters</h2>
                    <button (click)="isMobileFilterOpen = false" class="p-2 hover:bg-gray-100 rounded-full">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
                <div class="p-4">
                    <app-product-filters (filterChange)="onFilterChange($event)"></app-product-filters>
                </div>
                <div class="p-4 border-t bg-white sticky bottom-0">
                    <button (click)="isMobileFilterOpen = false"
                        class="w-full bg-primary text-white py-3 font-medium uppercase tracking-wide rounded-sm">
                        Apply Filters
                    </button>
                </div>
            </div>
        </div>

        <!-- Desktop Sidebar -->
        <div class="hidden lg:block w-64 flex-shrink-0">
            <div class="sticky top-24">
                <app-product-filters (filterChange)="onFilterChange($event)"></app-product-filters>
            </div>
        </div>

        <!-- Products Grid -->
        <div class="flex-1">
            <div class="mb-6 flex justify-between items-end">
                <div>
                    <h1 class="text-2xl font-bold">All Products</h1>
                    <p class="text-sm text-muted-foreground mt-1">
                        {{ filteredProducts.length }} products found
                    </p>
                </div>
                @if (isOwner) {
                <button (click)="navigateToAddProduct()"
                    class="bg-primary text-primary-foreground hover:bg-primary/90 px-4 py-2 rounded-md font-medium flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 12h14" />
                        <path d="M12 5v14" />
                    </svg>
                    Add Product
                </button>
                }
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                @for (product of filteredProducts; track product.id) {
                <app-product-card [product]="product"></app-product-card>
                }
            </div>
        </div>
    </div>
</div>
