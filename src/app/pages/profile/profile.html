<div class="container min-h-[600px] flex items-center justify-center py-10">
    <div class="w-full max-w-lg space-y-8 bg-card p-8 rounded-lg border shadow-sm relative">
        <!-- Close Button (Top Right) -->
        <button type="button" (click)="goBack()"
            class="absolute top-4 right-4 text-muted-foreground hover:text-foreground transition-colors p-2 rounded-full hover:bg-muted/50">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </button>

        <div class="text-center space-y-2">
            <h1 class="text-3xl font-serif font-bold tracking-tight">Edit Profile</h1>
            <p class="text-muted-foreground">Update your personal details below</p>
        </div>

        <form [formGroup]="profileForm" (ngSubmit)="onSubmit()" class="space-y-4">
            <div class="space-y-2">
                <label for="name" class="text-sm font-medium leading-none">Full Name</label>
                <input type="text" id="name" formControlName="name"
                    class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm ring-offset-background placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2"
                    placeholder="John Doe">
            </div>

            <div class="space-y-2">
                <label for="email" class="text-sm font-medium leading-none">Email</label>
                <input type="email" id="email" formControlName="email"
                    class="flex h-10 w-full rounded-md border border-input bg-muted px-3 py-2 text-sm ring-offset-background placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50"
                    placeholder="name@example.com">
            </div>

            <div class="space-y-2">
                <label for="phone" class="text-sm font-medium leading-none">Phone Number</label>
                <input type="tel" id="phone" formControlName="phone"
                    class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm ring-offset-background placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2"
                    placeholder="+1 (555) 000-0000">
            </div>

            <div class="space-y-2">
                <label for="address" class="text-sm font-medium leading-none">Address</label>
                <textarea id="address" formControlName="address" rows="3"
                    class="flex w-full rounded-md border border-input bg-background px-3 py-2 text-sm ring-offset-background placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 resize-none"
                    placeholder="123 Main St, City, Country"></textarea>
            </div>

            <div class="flex gap-3 pt-2">
                <button type="submit" [disabled]="profileForm.invalid || isSubmitting"
                    class="flex-1 inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 bg-primary text-primary-foreground hover:bg-primary/90 h-10 px-4 py-2">
                    {{ isSubmitting ? 'Updating...' : 'Update Profile' }}
                </button>
                <button type="button" (click)="goBack()"
                    class="flex-1 inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 bg-muted text-black hover:bg-muted/80 h-10 px-4 py-2">
                    Cancel
                </button>
            </div>
        </form>
    </div>
</div>
