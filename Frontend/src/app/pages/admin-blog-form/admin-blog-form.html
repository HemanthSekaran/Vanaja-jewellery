<div class="form-page">

  <!-- Header -->
  <div class="form-header">
    <button class="back-btn" routerLink="/admin/blog">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 19l-7-7 7-7" />
      </svg>
      Back
    </button>
    <h1>{{ isEditMode ? 'Edit Post' : 'New Blog Post' }}</h1>
  </div>

  <form (ngSubmit)="onSubmit()" class="form-card">

    <!-- Title -->
    <div class="field">
      <label for="title">Title <span class="req">*</span></label>
      <input id="title" type="text" [(ngModel)]="form.title" name="title" placeholder="e.g. The Beauty of Temple Jewellery" />
    </div>

    <!-- Row: Category + Author -->
    <div class="field-row">
      <div class="field">
        <label for="category">Category <span class="req">*</span></label>
        <select id="category" [(ngModel)]="form.category" name="category">
          <option value="" disabled>Select a category</option>
          @for (cat of categories; track cat) {
            <option [value]="cat">{{ cat }}</option>
          }
        </select>
      </div>
      <div class="field">
        <label for="author">Author <span class="req">*</span></label>
        <input id="author" type="text" [(ngModel)]="form.author" name="author" placeholder="e.g. Vanaja" />
      </div>
    </div>

    <!-- Excerpt -->
    <div class="field">
      <label for="excerpt">Excerpt <span class="req">*</span>
        <span class="hint">Short summary shown on blog cards and in search previews (1–2 sentences)</span>
      </label>
      <textarea id="excerpt" [(ngModel)]="form.excerpt" name="excerpt" rows="2"
        placeholder="A short, compelling summary of the post..."></textarea>
    </div>

    <!-- Content -->
    <div class="field">
      <label for="content">Content <span class="req">*</span>
        <span class="hint">Full article body</span>
      </label>
      <textarea id="content" [(ngModel)]="form.content" name="content" rows="10"
        placeholder="Write the full article content here..."></textarea>
    </div>

    <!-- Cover Image -->
    <div class="field">
      <label>Cover Image</label>
      @if (imagePreview) {
        <div class="image-preview-wrap">
          <img [src]="imagePreview" alt="Cover preview" class="image-preview" />
          <button type="button" class="remove-image" (click)="clearImage()" title="Remove image">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 6 6 18M6 6l12 12" />
            </svg>
          </button>
        </div>
      } @else {
        <label class="upload-zone" for="imageFile">
          <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242" />
            <path d="M12 12v9" /><path d="m16 16-4-4-4 4" />
          </svg>
          <span>Click to upload a cover image</span>
          <span class="upload-hint">JPG, PNG or WebP recommended</span>
          <input id="imageFile" type="file" accept="image/*" (change)="onFileSelected($event)" style="display:none" />
        </label>
      }
    </div>

    <!-- Actions -->
    <div class="form-actions">
      <button type="button" class="btn-cancel" (click)="cancel()">Cancel</button>
      <button type="submit" class="btn-submit" [disabled]="isSubmitting">
        {{ isEditMode ? 'Update Post' : 'Publish Post' }}
      </button>
    </div>

  </form>
</div>
