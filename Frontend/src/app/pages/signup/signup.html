<div class="min-h-screen flex">
    <!-- Brand Area (Left Side) - Hidden on mobile -->
    <div class="hidden lg:flex w-1/2 relative overflow-hidden items-center justify-center p-12"
        style="background: #001021; background-image: url('/images/background.png'); background-size: cover; background-position: center;">
        <!-- Velvet Cloth Simulation Layers (Fallback/Overlay) - Neutralized for maroon -->
        <div class="absolute inset-0 opacity-40 mix-blend-multiply"
            style="background: radial-gradient(circle at 30% 20%, #2a0000 0%, #1a0000 60%, #000000 100%);"></div>

        <!-- Texture/Noise Overlay -->
        <div class="absolute inset-0 opacity-[0.03]"
            style="background-image: url('data:image/svg+xml,%3Csvg viewBox=%220 0 200 200%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22noiseFilter%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.65%22 numOctaves=%223%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23noiseFilter)%22/%3E%3C/svg%3E');">
        </div>

        <!-- Fabric Folds (Gradients) -->
        <div class="absolute inset-0 opacity-20"
            style="background: linear-gradient(125deg, transparent 40%, rgba(255,255,255,0.05) 45%, transparent 50%, rgba(0,0,0,0.2) 60%, transparent 70%);">
        </div>

        <div class="absolute inset-0 bg-gradient-to-tr from-black/60 via-transparent to-secondary/20"></div>
        <div class="absolute -top-24 -left-24 w-96 h-96 bg-secondary/10 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-24 -right-24 w-96 h-96 bg-secondary/10 rounded-full blur-3xl"></div>

        <div class="relative z-10 text-center space-y-6 animate-in fade-in slide-in-from-bottom-6 duration-1000">
            <div
                class="w-20 h-20 bg-secondary/10 backdrop-blur-md rounded-full mx-auto flex items-center justify-center border border-secondary/30 shadow-2xl">
                <span class="text-3xl font-serif font-bold text-secondary shadow-sm">V</span>
            </div>
            <div>
                <h2 class="text-3xl font-serif font-bold text-[#FFF8DC] mb-3 tracking-tight drop-shadow-md">Sri Vanaja Jewellery
                </h2>
                <div class="w-16 h-0.5 bg-secondary mx-auto mb-4 opacity-80"></div>
                <p class="text-secondary text-sm font-semibold italic tracking-[0.2em] uppercase drop-shadow-sm">Your
                    Journey of
                    Elegance Starts Here</p>
            </div>
            <p class="text-[#FFF8DC]/80 max-w-sm mx-auto leading-relaxed text-sm font-light">
                Create an account to save your favorite designs, track your orders, and enjoy a curated luxury
                experience.
            </p>
        </div>
    </div>

    <!-- Signup Area (Right Side) -->
    <div
        class="w-full lg:w-1/2 flex items-center justify-center p-4 sm:p-8 lg:p-10 bg-background overflow-y-auto min-h-screen">
        <div class="w-full max-w-md space-y-3 h-fit my-auto">
            <div class="lg:hidden text-center mb-3">
                <span class="text-3xl font-serif font-bold text-primary">Vanaja Jewellery</span>
            </div>

            <div class="space-y-1 text-center lg:text-left">
                <h1 class="text-2xl font-serif font-bold text-secondary tracking-tight">Create Account</h1>
                <p class="text-muted-foreground text-sm">Please enter your details to join us</p>
            </div>

            <form [formGroup]="signupForm" (ngSubmit)="onSubmit()" class="space-y-2">
                <!-- Full Name -->
                <div class="space-y-1">
                    <label for="name" class="text-xs font-bold text-secondary uppercase tracking-[0.1em]">Full
                        Name</label>
                    <div class="relative group">
                        <input type="text" id="name" formControlName="name"
                            class="flex h-10 w-full rounded-lg border border-input bg-card/50 px-3 py-2 text-sm ring-offset-background placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary transition-all group-hover:border-primary/50"
                            [class.border-red-500]="signupForm.get('name')?.invalid && signupForm.get('name')?.touched"
                            placeholder="John Doe">
                    </div>
                </div>

                <!-- Email -->
                <div class="space-y-1">
                    <label for="email" class="text-xs font-bold text-secondary uppercase tracking-[0.1em]">Email
                        Address</label>
                    <div class="relative group">
                        <input type="email" id="email" formControlName="email"
                            class="flex h-10 w-full rounded-lg border border-input bg-card/50 px-3 py-2 text-sm ring-offset-background placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary transition-all group-hover:border-primary/50"
                            [class.border-red-500]="signupForm.get('email')?.invalid && signupForm.get('email')?.touched"
                            placeholder="your@email.com">
                    </div>
                </div>

                <!-- Password -->
                <div class="space-y-1">
                    <label for="password"
                        class="text-xs font-bold text-secondary uppercase tracking-[0.1em]">Password</label>
                    <div class="relative group">
                        <input [type]="showPassword() ? 'text' : 'password'" id="password" formControlName="password"
                            class="flex h-10 w-full rounded-lg border border-input bg-card/50 px-3 py-2 text-sm ring-offset-background focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary transition-all group-hover:border-primary/50 pr-10"
                            [class.border-red-500]="signupForm.get('password')?.invalid && signupForm.get('password')?.touched">
                        <button type="button" (click)="togglePassword()"
                            class="absolute right-0 top-0 h-full px-3 py-2 hover:text-primary focus:outline-none text-muted-foreground transition-colors">
                            @if (showPassword()) {
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path d="M9.88 9.88l-3.23-3.23m13.71 13.71l-3.23-3.23" />
                                <path
                                    d="M2 2l20 20M10.73 5.08A10.43 10.43 0 0112 5c7 0 10 7 10 7a13.16 13.16 0 01-1.67 2.68" />
                                <path d="M6.61 6.61A13.52 13.52 0 002 12s3 7 10 7a9.74 9.74 0 005.39-1.61" />
                                <path d="M13.12 13.12a3 3 0 11-4.24-4.24" />
                            </svg>
                            } @else {
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                            }
                        </button>
                    </div>
                </div>

                <!-- Phone -->
                <div class="space-y-1">
                    <label for="phone" class="text-xs font-bold text-secondary uppercase tracking-[0.1em]">Phone
                        Number</label>
                    <div class="relative group">
                        <input type="tel" id="phone" formControlName="phone"
                            class="flex h-10 w-full rounded-lg border border-input bg-card/50 px-3 py-2 text-sm ring-offset-background placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary transition-all group-hover:border-primary/50"
                            [class.border-red-500]="signupForm.get('phone')?.invalid && signupForm.get('phone')?.touched"
                            placeholder="10 digit number">
                    </div>
                </div>

                <!-- Address -->
                <div class="space-y-1">
                    <label for="address"
                        class="text-xs font-bold text-secondary uppercase tracking-[0.1em]">Address</label>
                    <div class="relative group">
                        <textarea id="address" formControlName="address" rows="2"
                            class="flex w-full rounded-lg border border-input bg-card/50 px-3 py-2 text-sm ring-offset-background placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary transition-all group-hover:border-primary/50 resize-none"
                            [class.border-red-500]="signupForm.get('address')?.invalid && signupForm.get('address')?.touched"
                            placeholder="Enter your full address"></textarea>
                    </div>
                </div>

                <button type="submit" [disabled]="isSubmitting"
                    class="relative w-full h-10 bg-primary text-primary-foreground rounded-lg font-bold uppercase tracking-widest hover:bg-primary/95 transition-all shadow-lg shadow-primary/20 hover:-translate-y-0.5 disabled:opacity-50 active:scale-95 group overflow-hidden mt-1">
                    <span class="relative z-10 flex items-center justify-center gap-2 text-sm">
                        {{ isSubmitting ? 'Registering...' : 'Create Account' }}
                        @if (!isSubmitting) {
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="transition-transform group-hover:translate-x-1">
                            <path d="M5 12h14" />
                            <path d="m12 5 7 7-7 7" />
                        </svg>
                        }
                    </span>
                </button>
            </form>

            <div class="pt-2 text-center text-sm">
                <p class="text-muted-foreground">
                    Already have an account?
                    <a routerLink="/login" class="text-primary font-bold hover:underline underline-offset-4 ml-1">
                        Sign In Here
                    </a>
                </p>
            </div>
        </div>
    </div>
</div>
