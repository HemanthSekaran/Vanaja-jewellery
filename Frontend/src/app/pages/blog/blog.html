<div class="min-h-screen bg-white">

    <!-- ── Admin toolbar (only visible when logged in as admin) ── -->
    @if (isAdmin()) {
    <div class="admin-bar">
        <span class="admin-bar-label">
            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/>
            </svg>
            Admin Mode
        </span>
        <div class="admin-bar-actions">
            <a routerLink="/admin/blog" class="admin-bar-btn secondary">Manage Posts</a>
            <a routerLink="/admin/blog/new" class="admin-bar-btn primary">
                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12h14"/><path d="M12 5v14"/>
                </svg>
                Add New Post
            </a>
        </div>
    </div>
    }

    <!-- Header -->
    <section
        class="bg-[#F5E6D3] py-16 sm:py-24 px-4 sm:px-12 lg:px-16 text-center relative border-b border-[#E6DCC8]">
        <div class="container mx-auto">
            <h1 class="text-4xl sm:text-5xl lg:text-6xl font-bold font-serif mb-4 tracking-tight text-[#8B0000]">Our
                Blog</h1>
            <div class="w-20 h-1 bg-[#D4AF37] mx-auto mb-8 rounded-full opacity-90 shadow-sm"></div>
            <p class="text-[#3D3D3D]/70 max-w-2xl mx-auto text-lg font-medium leading-relaxed italic">
                Discover the stories, expertise, and inspiration behind our timeless jewelry collections.
            </p>
        </div>
    </section>

    <!-- Blog Posts Grid -->
    <section class="py-16 px-4 sm:px-12 lg:px-16">
        <div class="container mx-auto">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 md:gap-12">
                @for (post of blogPosts(); track post.id) {
                <div class="relative">
                    <app-blog-card [post]="post"></app-blog-card>
                    @if (isAdmin()) {
                    <a [routerLink]="['/admin/blog/edit', post.id]"
                        class="absolute top-3 right-3 flex items-center gap-1 px-2.5 py-1 bg-black/70 text-white text-xs font-semibold rounded-full hover:bg-[#8B0000] transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                        </svg>
                        Edit
                    </a>
                    }
                </div>
                } @empty {
                <div class="col-span-full text-center py-24">
                    <p class="text-xl text-muted-foreground">No blog posts found. Check back soon!</p>
                </div>
                }
            </div>
        </div>
    </section>
</div>
