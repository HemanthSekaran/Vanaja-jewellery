<div class="container min-h-[calc(100vh-120px)] flex items-center justify-center py-8 px-4">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-gray-100 overflow-hidden relative">
        <!-- Accent Bar -->
        <div class="h-1.5 bg-gradient-to-r from-primary via-secondary to-primary"></div>

        <!-- Close Button -->
        <button type="button" (click)="goBack()"
            class="absolute top-4 right-4 text-gray-400 hover:text-primary transition-all duration-300 p-2 rounded-full hover:bg-gray-100 group">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
                class="group-hover:rotate-90 transition-transform">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </button>

        <div class="p-8 sm:p-10">
            <div class="text-center mb-8 relative">
                <h1 class="text-2xl md:text-3xl font-serif font-bold mb-3 tracking-tight text-primary">
                    Profile Settings
                </h1>
                <div class="w-16 h-1 bg-secondary mx-auto mb-5 rounded-full opacity-90 shadow-sm"></div>
                <p class="text-muted-foreground text-sm italic">Refine your personal elegance</p>
            </div>

            <form [formGroup]="profileForm" (ngSubmit)="onSubmit()" class="space-y-4">
                <!-- Full Name -->
                <div class="space-y-1">
                    <label for="name" class="text-xs font-bold text-secondary uppercase tracking-[0.1em]">Full
                        Name <span class="text-red-500">*</span></label>
                    <div class="relative group">
                        <input type="text" id="name" formControlName="name"
                            class="flex h-10 w-full rounded-lg border border-input bg-card/50 px-3 py-2 text-sm ring-offset-background placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary transition-all group-hover:border-primary/50"
                            [class.border-red-500]="profileForm.get('name')?.invalid && profileForm.get('name')?.touched"
                            placeholder="Your Full Name">
                    </div>
                </div>

                <!-- Email -->
                <div class="space-y-1">
                    <label for="email" class="text-xs font-bold text-secondary uppercase tracking-[0.1em]">Email
                        Address <span class="text-red-500">*</span></label>
                    <div class="relative group opacity-70">
                        <input type="email" id="email" formControlName="email"
                            class="flex h-10 w-full rounded-lg border border-input bg-gray-100 px-3 py-2 text-sm cursor-not-allowed outline-none"
                            readonly>
                    </div>
                </div>

                <!-- Phone -->
                <div class="space-y-1">
                    <label for="phone" class="text-xs font-bold text-secondary uppercase tracking-[0.1em]">Phone
                        Number</label>
                    <div class="relative group">
                        <input type="tel" id="phone" formControlName="phone"
                            class="flex h-10 w-full rounded-lg border border-input bg-card/50 px-3 py-2 text-sm ring-offset-background placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary transition-all group-hover:border-primary/50"
                            placeholder="10 digit number">
                    </div>
                </div>

                <!-- Address -->
                <div class="space-y-1">
                    <label for="address"
                        class="text-xs font-bold text-secondary uppercase tracking-[0.1em]">Address</label>
                    <div class="relative group">
                        <textarea id="address" formControlName="address" rows="2"
                            class="flex w-full rounded-lg border border-input bg-card/50 px-3 py-2 text-sm ring-offset-background placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary transition-all group-hover:border-primary/50 resize-none"
                            placeholder="Enter your full address"></textarea>
                    </div>
                </div>

                <div class="flex flex-col gap-3 pt-2">
                    <button type="submit" [disabled]="profileForm.invalid || isSubmitting"
                        class="relative w-full h-10 bg-primary text-primary-foreground rounded-lg font-bold uppercase tracking-widest hover:bg-primary/95 transition-all shadow-lg shadow-primary/20 hover:-translate-y-0.5 disabled:opacity-50 active:scale-95 group overflow-hidden">
                        <span class="relative z-10 flex items-center justify-center gap-2 text-sm">
                            {{ isSubmitting ? 'Saving Changes...' : 'Save Changes' }}
                            @if (!isSubmitting) {
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" class="transition-transform group-hover:translate-x-1">
                                <path d="M5 12h14" />
                                <path d="m12 5 7 7-7 7" />
                            </svg>
                            }
                        </span>
                    </button>

                    <button type="button" (click)="goBack()"
                        class="w-full text-xs text-muted-foreground hover:text-primary transition-colors font-semibold">
                        ← Return to Previous Page
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
