<div class="fixed inset-0 z-[9999] transform transition-transform duration-300 ease-in-out"
    [class.translate-x-0]="isOpen" [class.-translate-x-full]="!isOpen">

    <!-- Backdrop -->
    <div class="absolute inset-0 bg-black/50 transition-opacity" [class.opacity-100]="isOpen"
        [class.opacity-0]="!isOpen" (click)="onClose()"></div>

    <!-- Sidebar -->
    <div class="relative w-[300px] h-full bg-white shadow-xl flex flex-col">
        <!-- Menu Title -->
        <div class="border-b py-4 text-center">
            <div class="text-sm font-medium uppercase tracking-wider text-primary">Menu</div>
        </div>

        <!-- Close Button (Absolute) -->
        <button (click)="onClose()" class="absolute top-4 -right-10 bg-white p-2 rounded-full shadow-md text-gray-800"
            *ngIf="isOpen">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </button>

        <!-- Content Area -->
        <div class="flex-1 overflow-y-auto bg-gray-50">
            <div class="divide-y divide-gray-100 bg-white">
                <a routerLink="/" (click)="onClose()"
                    class="block px-5 py-4 text-sm font-medium text-gray-700 uppercase tracking-wide hover:bg-gray-50">
                    Home
                </a>
                <a routerLink="/about" (click)="onClose()"
                    class="block px-5 py-4 text-sm font-medium text-gray-700 uppercase tracking-wide hover:bg-gray-50">
                    About
                </a>
                <a routerLink="/contact" (click)="onClose()"
                    class="block px-5 py-4 text-sm font-medium text-gray-700 uppercase tracking-wide hover:bg-gray-50">
                    Contact
                </a>
                <a routerLink="/customization" (click)="onClose()"
                    class="block px-5 py-4 text-sm font-medium text-gray-700 uppercase tracking-wide hover:bg-gray-50">
                    customization
                </a>

                <!-- Accordions -->
                @for (category of menuCategories; track category.title; let i = $index) {
                <div>
                    <button (click)="toggleCategory(i)"
                        class="w-full px-5 py-4 flex items-center justify-between text-sm font-medium text-gray-700 uppercase tracking-wide hover:bg-gray-50 transition-colors">
                        {{ category.title }}
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="text-gray-400 transition-transform duration-200"
                            [class.rotate-180]="category.isOpen">
                            <polyline points="6 9 12 15 18 9"></polyline>
                        </svg>
                    </button>

                    <div class="bg-gray-50 overflow-hidden transition-all duration-300 ease-in-out"
                        [style.max-height]="category.isOpen ? '500px' : '0'">
                        <div class="px-5 py-2 space-y-1">
                            @for (item of category.items; track item.label) {
                            <a [routerLink]="item.link" [queryParams]="item.queryParams" (click)="onClose()"
                                class="block py-2.5 text-sm text-gray-600 hover:text-primary pl-4 border-l-2 border-transparent hover:border-primary transition-colors">
                                {{ item.label }}
                            </a>
                            }
                        </div>
                    </div>
                </div>
                }

            </div>
        </div>
    </div>
</div>
