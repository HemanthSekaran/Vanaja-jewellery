<div class="bg-white rounded-lg shadow-sm border border-gray-100 overflow-hidden">
    <!-- Header -->
    <div class="p-5 border-b border-gray-100 bg-gray-50/50 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="text-primary">
                <line x1="4" y1="21" x2="4" y2="14"></line>
                <line x1="4" y1="10" x2="4" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="12"></line>
                <line x1="12" y1="8" x2="12" y2="3"></line>
                <line x1="20" y1="21" x2="20" y2="16"></line>
                <line x1="20" y1="12" x2="20" y2="3"></line>
                <line x1="1" y1="14" x2="7" y2="14"></line>
                <line x1="9" y1="8" x2="15" y2="8"></line>
                <line x1="17" y1="16" x2="23" y2="16"></line>
            </svg>
            <h2 class="text-xl font-serif font-bold text-gray-900 tracking-wide">Filters</h2>
        </div>
        <button (click)="clearFilters()"
            class="text-xs text-primary hover:text-primary/80 font-bold uppercase tracking-wider transition-colors">
            Clear All
        </button>
    </div>

    <!-- Search -->
    <div class="border-b border-gray-100">
        <button
            class="w-full px-5 py-4 flex items-center justify-between bg-white hover:bg-gray-50 transition-colors group"
            (click)="toggleSection('search')">
            <div class="flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="text-gray-400 group-hover:text-primary transition-colors">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <h3 class="text-sm font-bold text-gray-900 uppercase tracking-widest">Search</h3>
            </div>
            <span class="text-gray-300 text-lg transition-transform duration-300"
                [class.rotate-180]="openSections['search']">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m6 9 6 6 6-6" />
                </svg>
            </span>
        </button>
        <div class="px-5 pb-5 transition-all duration-300 ease-in-out" [class.hidden]="!openSections['search']">
            <div class="relative group">
                <input type="text" [(ngModel)]="searchTerm" (input)="onFilterChange()" placeholder="Search Products..."
                    class="w-full pl-10 pr-4 py-3 text-sm border border-gray-200 rounded-md focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary/20 transition-all bg-gray-50 focus:bg-white">
                <svg xmlns="http://www.w3.org/2000/svg"
                    class="h-5 w-5 text-gray-400 absolute left-3 top-3 group-focus-within:text-primary transition-colors"
                    fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
            </div>
        </div>
    </div>

    <!-- Category (Checkboxes) -->
    <div class="border-b border-gray-100">
        <button
            class="w-full px-5 py-4 flex items-center justify-between bg-white hover:bg-gray-50 transition-colors group"
            (click)="toggleSection('category')">
            <div class="flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="text-gray-400 group-hover:text-primary transition-colors">
                    <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"></path>
                    <path d="M3 6h18"></path>
                    <path d="M16 10a4 4 0 0 1-8 0"></path>
                </svg>
                <h3 class="text-sm font-bold text-gray-900 uppercase tracking-widest">Category</h3>
                <span *ngIf="getActiveCount('category') > 0"
                    class="ml-2 bg-primary text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full">
                    {{ getActiveCount('category') }}
                </span>
            </div>
            <span class="text-gray-300 text-lg transition-transform duration-300"
                [class.rotate-180]="openSections['category']">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m6 9 6 6 6-6" />
                </svg>
            </span>
        </button>
        <div class="px-5 pb-5" [class.hidden]="!openSections['category']">
            <div class="space-y-3">
                @for (category of categories; track category) {
                <div class="flex items-center group cursor-pointer"
                    (click)="selectedCategories[category] = !selectedCategories[category]; onFilterChange()">
                    <div class="w-5 h-5 border rounded flex items-center justify-center transition-colors"
                        [class.bg-primary]="selectedCategories[category]"
                        [class.border-primary]="selectedCategories[category]"
                        [class.border-gray-300]="!selectedCategories[category]"
                        [class.group-hover:border-primary]="!selectedCategories[category]">
                        <svg *ngIf="selectedCategories[category]" xmlns="http://www.w3.org/2000/svg" width="14"
                            height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"
                            stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12" />
                        </svg>
                    </div>
                    <label
                        class="ml-3 text-sm text-gray-600 cursor-pointer group-hover:text-primary transition-colors select-none">
                        {{ category }}
                    </label>
                </div>
                }
            </div>
        </div>
    </div>

    <!-- Metal Color (Checkboxes) -->
    <div class="border-b border-gray-100">
        <button
            class="w-full px-5 py-4 flex items-center justify-between bg-white hover:bg-gray-50 transition-colors group"
            (click)="toggleSection('metalType')">
            <div class="flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="text-gray-400 group-hover:text-primary transition-colors">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path
                        d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41">
                    </path>
                </svg>
                <h3 class="text-sm font-bold text-gray-900 uppercase tracking-widest">Metal</h3>
                <span *ngIf="getActiveCount('metalType') > 0"
                    class="ml-2 bg-primary text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full">
                    {{ getActiveCount('metalType') }}
                </span>
            </div>
            <span class="text-gray-300 text-lg transition-transform duration-300"
                [class.rotate-180]="openSections['metalType']">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m6 9 6 6 6-6" />
                </svg>
            </span>
        </button>
        <div class="px-5 pb-5" [class.hidden]="!openSections['metalType']">
            <div class="space-y-3">
                @for (metal of metals; track metal) {
                <div class="flex items-center group cursor-pointer"
                    (click)="selectedMetals[metal] = !selectedMetals[metal]; onFilterChange()">
                    <div class="w-5 h-5 border rounded flex items-center justify-center transition-colors"
                        [class.bg-primary]="selectedMetals[metal]" [class.border-primary]="selectedMetals[metal]"
                        [class.border-gray-300]="!selectedMetals[metal]"
                        [class.group-hover:border-primary]="!selectedMetals[metal]">
                        <svg *ngIf="selectedMetals[metal]" xmlns="http://www.w3.org/2000/svg" width="14" height="14"
                            viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"
                            stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12" />
                        </svg>
                    </div>
                    <label
                        class="ml-3 text-sm text-gray-600 cursor-pointer group-hover:text-primary transition-colors select-none">
                        {{ metal }}
                    </label>
                </div>
                }
            </div>
        </div>
    </div>

    <!-- Purity (Checkboxes) -->
    <div class="border-b border-gray-100">
        <button
            class="w-full px-5 py-4 flex items-center justify-between bg-white hover:bg-gray-50 transition-colors group"
            (click)="toggleSection('purity')">
            <div class="flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="text-gray-400 group-hover:text-primary transition-colors">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
                </svg>
                <h3 class="text-sm font-bold text-gray-900 uppercase tracking-widest">Purity</h3>
                <span *ngIf="getActiveCount('purity') > 0"
                    class="ml-2 bg-primary text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full">
                    {{ getActiveCount('purity') }}
                </span>
            </div>
            <span class="text-gray-300 text-lg transition-transform duration-300"
                [class.rotate-180]="openSections['purity']">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m6 9 6 6 6-6" />
                </svg>
            </span>
        </button>
        <div class="px-5 pb-5" [class.hidden]="!openSections['purity']">
            <div class="space-y-3">
                @for (purity of purities; track purity) {
                <div class="flex items-center group cursor-pointer"
                    (click)="selectedPurities[purity] = !selectedPurities[purity]; onFilterChange()">
                    <div class="w-5 h-5 border rounded flex items-center justify-center transition-colors"
                        [class.bg-primary]="selectedPurities[purity]" [class.border-primary]="selectedPurities[purity]"
                        [class.border-gray-300]="!selectedPurities[purity]"
                        [class.group-hover:border-primary]="!selectedPurities[purity]">
                        <svg *ngIf="selectedPurities[purity]" xmlns="http://www.w3.org/2000/svg" width="14" height="14"
                            viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"
                            stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12" />
                        </svg>
                    </div>
                    <label
                        class="ml-3 text-sm text-gray-600 cursor-pointer group-hover:text-primary transition-colors select-none">
                        {{ purity }}
                    </label>
                </div>
                }
            </div>
        </div>
    </div>

    <!-- Weight Range -->
    <div>
        <button
            class="w-full px-5 py-4 flex items-center justify-between bg-white hover:bg-gray-50 transition-colors group"
            (click)="toggleSection('weight')">
            <div class="flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="text-gray-400 group-hover:text-primary transition-colors">
                    <path d="M20 12V8H6a2 2 0 0 1-2-2c0-1.1.9-2 2-2h12v4"></path>
                    <path d="M4 6v12c0 1.1.9 2 2 2h14v-4"></path>
                    <path d="M18 12a2 2 0 0 0-2 2c0 1.1.9 2 2 2h4v-4h-4z"></path>
                </svg>
                <h3 class="text-sm font-bold text-gray-900 uppercase tracking-widest">Weight</h3>
                <span *ngIf="getActiveCount('weight') > 0"
                    class="ml-2 bg-primary text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full">
                    {{ getActiveCount('weight') }}
                </span>
            </div>
            <span class="text-gray-300 text-lg transition-transform duration-300"
                [class.rotate-180]="openSections['weight']">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m6 9 6 6 6-6" />
                </svg>
            </span>
        </button>
        <div class="px-5 pb-5" [class.hidden]="!openSections['weight']">
            <div class="space-y-3">
                @for (range of weightRanges; track range.label) {
                <div class="flex items-center group cursor-pointer"
                    (click)="selectedWeightRanges[range.label] = !selectedWeightRanges[range.label]; onFilterChange()">
                    <div class="w-5 h-5 border rounded flex items-center justify-center transition-colors"
                        [class.bg-primary]="selectedWeightRanges[range.label]"
                        [class.border-primary]="selectedWeightRanges[range.label]"
                        [class.border-gray-300]="!selectedWeightRanges[range.label]"
                        [class.group-hover:border-primary]="!selectedWeightRanges[range.label]">
                        <svg *ngIf="selectedWeightRanges[range.label]" xmlns="http://www.w3.org/2000/svg" width="14"
                            height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"
                            stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12" />
                        </svg>
                    </div>
                    <label
                        class="ml-3 text-sm text-gray-600 cursor-pointer group-hover:text-primary transition-colors select-none">
                        {{ range.label }}
                    </label>
                </div>
                }
            </div>
        </div>
    </div>
</div>
