<div class="bg-white border rounded-sm">
    <!-- Header -->
    <div class="p-4 border-b">
        <h2 class="text-lg font-medium text-gray-900">Filters</h2>
    </div>

    <!-- Search -->
    <div class="border-b">
        <button
            class="w-full px-4 py-3 flex items-center justify-between bg-white hover:bg-gray-50 transition-colors group"
            (click)="toggleSection('search')">
            <h3 class="text-sm font-medium text-gray-700 uppercase tracking-wide">Search</h3>
            <span class="text-gray-400 text-xl font-light leading-none">
                {{ openSections['search'] ? '-' : '+' }}
            </span>
        </button>
        <div class="px-4 pb-4" [class.hidden]="!openSections['search']">
            <div class="relative">
                <input type="text" [(ngModel)]="searchTerm" (input)="onFilterChange()" placeholder="Search by name..."
                    class="w-full pl-10 pr-4 py-2 text-sm border border-gray-200 rounded-sm focus:outline-none focus:border-primary transition-colors bg-white">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-400 absolute left-3 top-2.5"
                    fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
            </div>
        </div>
    </div>

    <!-- Category -->
    <div class="border-b">
        <button
            class="w-full px-4 py-3 flex items-center justify-between bg-white hover:bg-gray-50 transition-colors group"
            (click)="toggleSection('category')">
            <h3 class="text-sm font-medium text-gray-700 uppercase tracking-wide">Category</h3>
            <span class="text-gray-400 text-xl font-light leading-none">
                {{ openSections['category'] ? '-' : '+' }}
            </span>
        </button>
        <div class="px-4 pb-4" [class.hidden]="!openSections['category']">
            <div class="space-y-2">
                @for (category of categories; track category) {
                <div class="flex items-center">
                    <input type="radio" [id]="'cat-'+category" name="category" [value]="category"
                        [(ngModel)]="selectedCategory" (change)="onFilterChange()"
                        class="w-4 h-4 text-primary border-gray-300 focus:ring-primary cursor-pointer accent-primary">
                    <label [for]="'cat-'+category"
                        class="ml-3 text-sm text-gray-600 cursor-pointer hover:text-primary transition-colors">
                        {{ category }}
                    </label>
                </div>
                }
            </div>
        </div>
    </div>

    <!-- Metal Type -->
    <div class="border-b">
        <button
            class="w-full px-4 py-3 flex items-center justify-between bg-white hover:bg-gray-50 transition-colors group"
            (click)="toggleSection('metalType')">
            <h3 class="text-sm font-medium text-gray-700 uppercase tracking-wide">Metal Color</h3>
            <span class="text-gray-400 text-xl font-light leading-none">
                {{ openSections['metalType'] ? '-' : '+' }}
            </span>
        </button>
        <div class="px-4 pb-4" [class.hidden]="!openSections['metalType']">
            <div class="space-y-2">
                @for (metalType of metalTypes; track metalType) {
                <div class="flex items-center">
                    <input type="radio" [id]="'type-'+metalType" name="metalType" [value]="metalType"
                        [(ngModel)]="selectedMetalType" (change)="onFilterChange()"
                        class="w-4 h-4 text-primary border-gray-300 focus:ring-primary cursor-pointer accent-primary">
                    <label [for]="'type-'+metalType"
                        class="ml-3 text-sm text-gray-600 cursor-pointer hover:text-primary transition-colors">
                        {{ metalType }}
                    </label>
                </div>
                }
            </div>
        </div>
    </div>

    <!-- Purity -->
    <div class="border-b">
        <button
            class="w-full px-4 py-3 flex items-center justify-between bg-white hover:bg-gray-50 transition-colors group"
            (click)="toggleSection('purity')">
            <h3 class="text-sm font-medium text-gray-700 uppercase tracking-wide">Metal Purity</h3>
            <span class="text-gray-400 text-xl font-light leading-none">
                {{ openSections['purity'] ? '-' : '+' }}
            </span>
        </button>
        <div class="px-4 pb-4" [class.hidden]="!openSections['purity']">
            <div class="space-y-2">
                @for (purity of purities; track purity) {
                <div class="flex items-center">
                    <input type="checkbox" [id]="purity" [(ngModel)]="selectedPurities[purity]"
                        (change)="onFilterChange()"
                        class="w-4 h-4 text-primary border-gray-300 rounded focus:ring-primary cursor-pointer accent-primary">
                    <label [for]="purity"
                        class="ml-3 text-sm text-gray-600 cursor-pointer hover:text-primary transition-colors">
                        {{ purity }}
                    </label>
                </div>
                }
            </div>
        </div>
    </div>

    <!-- Weight Range -->
    <div class="border-b">
        <button
            class="w-full px-4 py-3 flex items-center justify-between bg-white hover:bg-gray-50 transition-colors group"
            (click)="toggleSection('weight')">
            <h3 class="text-sm font-medium text-gray-700 uppercase tracking-wide">Weight Filter</h3>
            <span class="text-gray-400 text-xl font-light leading-none">
                {{ openSections['weight'] ? '-' : '+' }}
            </span>
        </button>
        <div class="px-4 pb-4" [class.hidden]="!openSections['weight']">
            <div class="space-y-2">
                @for (range of weightRanges; track range.label) {
                <div class="flex items-center">
                    <input type="checkbox" [id]="range.label" [(ngModel)]="selectedWeightRanges[range.label]"
                        (change)="onFilterChange()"
                        class="w-4 h-4 text-primary border-gray-300 rounded focus:ring-primary cursor-pointer accent-primary">
                    <label [for]="range.label"
                        class="ml-3 text-sm text-gray-600 cursor-pointer hover:text-primary transition-colors">
                        {{ range.label }}
                    </label>
                </div>
                }
            </div>
        </div>
    </div>

    <!-- Price Range -->
    <div>
        <button
            class="w-full px-4 py-3 flex items-center justify-between bg-white hover:bg-gray-50 transition-colors group"
            (click)="toggleSection('price')">
            <h3 class="text-sm font-medium text-gray-700 uppercase tracking-wide">Price Range</h3>
            <span class="text-gray-400 text-xl font-light leading-none">
                {{ openSections['price'] ? '-' : '+' }}
            </span>
        </button>
        <div class="px-4 pb-4" [class.hidden]="!openSections['price']">
            <input type="range" min="0" max="500000" step="1000" [(ngModel)]="priceRange" (input)="onFilterChange()"
                class="w-full h-1.5 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-primary">
            <div class="flex justify-between text-xs text-gray-500 mt-2">
                <span>₹0</span>
                <span class="font-medium text-gray-900">₹{{ priceRange | number }}</span>
            </div>
        </div>
    </div>
</div>
