<article class="bg-white rounded-xl overflow-hidden shadow-sm hover:shadow-md transition-shadow duration-300 border border-border group h-full flex flex-col">
    <div class="relative aspect-[3/2] overflow-hidden">
        <img [src]="post.image" [alt]="post.title" 
             class="w-full h-full object-cover object-top transition-transform duration-500 group-hover:scale-105">
        <div class="absolute top-3 left-3">
            <span class="px-2 py-0.5 bg-white/90 backdrop-blur-sm text-primary text-[10px] font-bold rounded-full uppercase tracking-wider">
                {{ post.category }}
            </span>
        </div>
    </div>
    
    <div class="p-4 flex flex-col flex-grow">
        <div class="flex items-center gap-2 text-muted-foreground text-[11px] mb-2">
            <span>{{ post.date | date:'mediumDate' }}</span>
            <span class="w-1 h-1 rounded-full bg-muted-foreground/30"></span>
            <span>By {{ post.author }}</span>
        </div>
        
        <h3 class="text-lg font-bold mb-2 font-serif line-clamp-1 group-hover:text-primary transition-colors">
            <a [routerLink]="['/blog', post.slug]">{{ post.title }}</a>
        </h3>
        
        <p class="text-muted-foreground text-sm line-clamp-2 mb-4 flex-grow">
            {{ post.excerpt }}
        </p>
        
        <a [routerLink]="['/blog', post.slug]" 
           class="inline-flex items-center text-primary text-sm font-bold hover:gap-2 transition-all">
            Read More
            <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 ml-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
            </svg>
        </a>
    </div>
</article>
